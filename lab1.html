<html>
<head>
    <title>Pental Shop</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    
    <table id="inventory">
        <tr>
                <th>Item Name</th>
                <th>Quantity</th>
                <th>Status</th>
            </tr>
            <tr>
                <td>Pencils</td>
                <td>100</td>
                <td>In Stock</td>
            </tr>
            <tr>
                <td>Notebooks</td>
                <td>50</td>
                <td>Low Stock</td>
            </tr>
            <tr>
                <td>Markers</td>
                <td>15</td>
                <td>In stock</td>
            </tr>
    </table>

    <br><br>

   
    <table id="contact">
        <tr>
            <th colspan="2">Contact Information</th>
        </tr>

        <tr>
            <td>Name</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Email</td>
            <td><input type="email"></td>
        </tr>

        <tr>
            <td>Message</td>
            <td><textarea rows="4" cols="30"></textarea></td>
        </tr>

        <tr>
            <td></td>
            <td><input type="submit" value="Submit"></td>
        </tr>
    </table>

</body>
</html>
